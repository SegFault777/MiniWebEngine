name: Build

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  engine:
    name: engine + headless browser (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            ldflags: -Wl,--gc-sections -s
          - name: windows-x86_64
            os: windows-latest
            ldflags: -Wl,--gc-sections -s
          - name: macos
            os: macos-latest
            ldflags: -Wl,-dead_strip
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Warn if the stand-in font is still embedded
        run: |
          if grep -q "STAND-IN" mwe_font.h; then
            echo "::warning file=mwe_font.h::mwe_font.h is a stand-in font, not Inter. See fonts/README.md"
          fi

      - name: Build engine CLI
        run: |
          cc -std=c99 -Wall -Wextra -Os -ffunction-sections -fdata-sections \
             -fno-asynchronous-unwind-tables -fno-ident \
             ${{ matrix.ldflags }} mwe.c -o mwe
          ls -l mwe*

      - name: Smoke test (render test.html and malformed input)
        run: |
          ./mwe test.html out.bmp 800
          test -s out.bmp
          head -c 2 out.bmp | grep -q '^BM$'
          printf 'plain <b>text</b> &#65; < 5 <unclosed' > bad.html
          ./mwe bad.html bad.bmp 300
          test -s bad.bmp

      - name: Build and test headless MiniBrowser
        run: |
          cc -std=gnu99 -Wall -Wextra -Os -DMWE_LIB \
             mwe.c browser/minibrowser.c browser/mb_shot.c -o mb_shot
          ./mb_shot about:home home.bmp 1000 640
          ./mb_shot "$PWD/test.html" page.bmp 1000 640
          test -s home.bmp && test -s page.bmp

      - name: Report binary sizes
        run: |
          for f in mwe mwe.exe mb_shot mb_shot.exe; do
            [ -f "$f" ] && echo "${{ matrix.name }} $f: $(wc -c < "$f") bytes" >> "$GITHUB_STEP_SUMMARY"
          done
          true

      - uses: actions/upload-artifact@v4
        with:
          name: engine-${{ matrix.name }}
          path: |
            mwe
            mwe.exe
            home.bmp
            page.bmp
          if-no-files-found: ignore

  minibrowser-windows:
    name: MiniBrowser (Windows)
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Build minibrowser.exe
        run: |
          gcc -std=gnu99 -Wall -Wextra -Os -s -ffunction-sections -fdata-sections \
              -Wl,--gc-sections -DMWE_LIB -mwindows \
              mwe.c browser/minibrowser.c browser/mb_win32.c \
              -o minibrowser.exe -lws2_32 -lgdi32 -luser32
          ls -l minibrowser.exe
          echo "minibrowser.exe: $(wc -c < minibrowser.exe) bytes" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: minibrowser-windows-x86_64
          path: minibrowser.exe
